<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Lavender Lair</title>
    <link rel="icon" href="imgs/icon.png" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: url('imgs/homebg.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        .header {
            position: relative;
            width: 100%;
            height: 300px;
            background-image: url('imgs/about-banner.jpg');
            background-size: cover;
            background-position: center;
            text-align: center;
        }

        .logo {
            margin-top: 50px; /* Add space between the top and the logo */
        }

        .logo img {
            width: 300px;
            border-radius: 15px;
            cursor: pointer;
        }

        .event-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .event-image-container {
            flex: 0 1 450px;
            text-align: center;
            margin: 30px;
        }

        .event-image-container img {
            width: 450px;
            height: 400px; /* Increased height */
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        }

        .event-description {
            flex: 1;
            max-width: 500px;
            text-align: center;
            background-color: rgba(153, 217, 149, 0.8);
            border-radius: 15px;
            padding: 30px;
            margin: 30px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .event-description h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ffeabe;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6);
        }

        .event-description p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #ffeabe;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .join-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #ada3da;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .join-button:hover {
            background-color: #9b7dca;
        }

        @media (max-width: 768px) {
            .header {
                height: 200px;
            }

            .logo img {
                width: 200px;
            }

            .event-content {
                flex-direction: column;
            }

            .event-image-container img {
                width: 300px;
                height: auto;
            }

            .event-description {
                text-align: center;
                padding: 20px;
            }

            .event-description h2 {
                font-size: 2rem;
            }

            .event-description p {
                font-size: 1rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <a href="index.html" class="logo">
            <img src="imgs/events.png" alt="Lavender Lair Logo">
        </a>
    </div>

    <div class="event-content">
        <div class="event-image-container">
            <img src="imgs/giveaway.png" alt="Event Image">
        </div>

        <div class="event-description">
            <h2>100 Robux Giveaway!</h2>
            <p>
                Since the year is ending and the Holidays are approaching. Nori is holding a 100 Robux giveaway. A hundred Robux and one Winner! Only active members that are known by Nori are elligible to join. <br><br> Giveaway ends at Wednesday, 25 December 2024 7:00 pm
            </p>
            <a href="https://discord.gg/m526yz2Kj8" class="join-button">Join!</a>
        </div>
    </div>
</body>
</html>
