<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Lavender Lair</title>
    <link rel="icon" href="imgs/icon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* --- 1. LOADING SCREEN --- */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c2f33; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loading-text { color: #ffeabe; font-size: 1rem; margin-bottom: 20px; animation: blink 0.8s infinite; }
        .progress-container { width: 300px; height: 30px; border: 6px solid #99d995; padding: 4px; background: rgba(0,0,0,0.2); }
        .progress-fill { height: 100%; background-color: #b19cd9; width: 0%; animation: fillProgress 0.5s steps(3) forwards; }
        @keyframes fillProgress { to { width: 100%; } }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- 2. BASE STYLES --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: url('imgs/homebg.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            text-align: center;
            padding: 30px 0;
        }

        .header img {
            width: 350px;
        }

        /* --- 3. THE CHARACTER SELECT LAYOUT --- */
        .select-container {
            display: flex;
            gap: 40px;
            width: 95%;
            max-width: 1100px;
            margin-bottom: 50px;
        }

        /* GRID WRAPPER & TITLE */
        .grid-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .select-title {
            font-size: 1rem;
            color: #f9e085;
            text-shadow: 2px 2px 0px #a3a3a3;
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 4px double #99d995;
            width: fit-content;
        }

        /* THE GRID */
        .portrait-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px 15px;
            align-content: start;
        }

        .portrait {
            width: 120px;
            height: 120px;
            background-color: #99d995;
            border: 6px solid #99d995;
            border-radius: 15px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.1s, border-color 0.2s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        .portrait:hover, .portrait.active {
            transform: scale(1.1);
            border-color: #b19cd9;
            animation: pulse-border 0.6s infinite ease-in-out;
            z-index: 10;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0px #b19cd9; }
            50% { box-shadow: 0 0 15px #b19cd9; }
            100% { box-shadow: 0 0 0px #b19cd9; }
        }

        /* RIGHT SIDE: STAT CARD */
        .info-card {
            flex: 1.2;
            background: rgba(44, 47, 51, 0.9);
            border: 10px solid #99d995;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            min-height: 480px;
        }

        .card-image {
            width: 100%;
            height: 250px;
            border: 4px solid #b19cd9;
            margin-bottom: 20px;
            border-radius: 10px;
            object-fit: contain; 
            background-color: rgba(0,0,0,0.3);
        }

        .card-header {
            border-bottom: 4px solid #b19cd9;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .card-username {
            color: #ffeabe;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .card-status {
            color: #99d995;
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .card-body {
            font-size: 0.7rem;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #ffeabe;
            text-decoration: none;
            font-size: 0.7rem;
        }

        .back-btn:hover { text-decoration: underline; color: #b19cd9; }

        @media (max-width: 900px) {
            .select-container { flex-direction: column; align-items: center; }
            .grid-wrapper { order: 2; align-items: center; }
            .info-card { order: 1; width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loading-text">LOADING MEMBERS...</div>
        <div class="progress-container">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="header">
        <a href="index.html"><img src="imgs/members.png" alt="Members Title"></a>
    </div>

    <div class="select-container">
        <div class="grid-wrapper">
            <h2 class="select-title">MEMBER SELECT</h2>
            <div class="portrait-grid">
                <div class="portrait active" onclick="showMember('carlito', event)">
                    <img src="imgs/carlicon.png" alt="Carlito">
                </div>
                <div class="portrait" onclick="showMember('paul', event)">
                    <img src="imgs/neilicon.png" alt="Paul">
                </div>
                <div class="portrait" onclick="showMember('rebel', event)">
                    <img src="imgs/rebelicon.png" alt="Rebel">
                </div>
                <div class="portrait" onclick="showMember('tabby', event)">
                    <img src="imgs/tabbyicon.png" alt="Tabby">
                </div>
                <div class="portrait" onclick="showMember('cakey', event)">
                    <img src="imgs/cakeyicon.png" alt="Cakey">
                </div>
                <div class="portrait" onclick="showMember('nori', event)">
                    <img src="imgs/noriicon.png" alt="Nori">
                </div>
            </div>
        </div>

        <div class="info-card" id="member-card">
            <div id="card-content">
                <img src="imgs/carlprofile.png" class="card-image" id="display-img">
                <div class="card-header">
                    <div class="card-username" id="display-name">Carlito</div>
                    <div class="card-status" id="display-status">"Mama mo blue"</div>
                </div>
                <div class="card-body" id="display-desc">
                    Mother of all. the creator of the server. A legend an Icon and he is the moment. If you're ever lost, let him guide you.
                </div>
            </div>
            <br>
            <a href="index.html" class="back-btn"><< BACK TO HOME</a>
        </div>
    </div>

    <script>
        const memberData = {
            carlito: {
                name: "Carlito",
                status: '"Fueled by milk"',
                desc: "Mother of all. the creator of the server. A legend an Icon and he is the moment. If you're ever lost, let him guide you. Bringing people together is what he's good at.",
                img: "imgs/carlprofile.png"
            },
            paul: {
                name: "Paul McDuckney",
                status: '"neowwwwwwwwwwwww✈️"',
                desc: "Trusted Admin and friend, Ducky or Neil, is Carl's player 2. A wise and mature person and a good listener. He's always down for whatever.",
                img: "imgs/neilprofile.png"
            },
            rebel: {
                name: "RebelEllis",
                status: '"Let\'s give it the benefit of the drought"',
                desc: "Carl's bestest friend, Co-owner of the server. Rebel radiates with energy, with flamboyance and style! Bold and energetic, he gets the party started.",
                img: "imgs/rebelprofile.png"
            },
            tabby: {
                name: "Tabby",
                status: '"Queen never cry."',
                desc: "Timid at first, Tabby is a young one with lots of energy. If you ever need a good companion, Tabby will never fail to hype you up.",
                img: "imgs/tabbyprofile.png"
            },
            cakey: {
                name: "Cakey",
                status: '"Simple is what simply makes me the best."',
                desc: "A trusted admin and friend. Cakey is also a flamboyant one, but gentle on the inside. Guaranteed to make you laugh.",
                img: "imgs/cakeyprofile.png"
            },
            nori: {
                name: "Nori",
                status: '"Just Meowing around🐱"',
                desc: "Our resident cat person. Master behind our server emoticons! A good teacher radiating with kindness.",
                img: "imgs/noriprofile.png"
            }
        };

        function showMember(id, event) {
            const data = memberData[id];
            
            // Update Card
            document.getElementById('display-name').innerText = data.name;
            document.getElementById('display-status').innerText = data.status;
            document.getElementById('display-desc').innerText = data.desc;
            document.getElementById('display-img').src = data.img;

            // Update Portrait highlight
            document.querySelectorAll('.portrait').forEach(p => p.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // Loader script
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 500); 
            }, 1800); 
        });
    </script>
</body>
</html>
